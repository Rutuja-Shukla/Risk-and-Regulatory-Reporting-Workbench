version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: dotnet-reference/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=risk_workbench;Username=workbench;Password=workbench_secret
      - Keycloak__Authority=http://keycloak:8080/realms/reporting-workbench
      - Keycloak__Audience=reporting-api
      - OpenTelemetry__Endpoint=http://otel-collector:4317
    depends_on:
      - postgres
      - keycloak

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: risk_workbench
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_secret
    ports:
      - "8080:8080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  pgdata:
