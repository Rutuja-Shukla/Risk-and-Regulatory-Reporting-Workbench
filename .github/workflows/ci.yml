name: Continuous Integration & Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: .NET 8 Build, xUnit & Testcontainers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore dotnet-reference/ReportingWorkbench.csproj

      - name: Build
        run: dotnet build dotnet-reference/ReportingWorkbench.csproj --no-restore --configuration Release

      - name: Run xUnit Tests (Reproducibility & Permission Matrix)
        run: dotnet test dotnet-reference/ReportingWorkbench.csproj --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Dependency Vulnerability Audit
        run: dotnet list dotnet-reference/ReportingWorkbench.csproj package --vulnerable --include-transitive

  frontend-check:
    name: React / TypeScript Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run lint

      - name: Production Bundle Build
        run: npm run build

      - name: npm Audit (Security Scan)
        run: npm audit --audit-level=high

  security-scan:
    name: Trivy Container & Repository Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
